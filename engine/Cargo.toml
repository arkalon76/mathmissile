[package]
name = "mathmissile-engine"
version = "0.1.0"
edition = "2021"
description = "Math Missile game engine: simulation + WebGL2 rendering, compiled to WebAssembly"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Document",
  "Window",
  "Element",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "TextMetrics",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlBuffer",
  "WebGlVertexArrayObject",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlContextAttributes",
  "WebGlPowerPreference",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# wasm-opt is run by build.sh only when it is installed locally (no network fetch).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
